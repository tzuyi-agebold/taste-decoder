# Taste Decoder — XcodeGen spec.
# Generate the Xcode project with:  xcodegen generate
# Per-developer values (team, bundle id prefix, Claude API key) live in Config/Secrets.xcconfig.

name: TasteDecoder

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.0.0

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(TD_DEVELOPMENT_TEAM)
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  TasteDecoder:
    type: application
    platform: iOS
    sources:
      - path: TasteDecoder
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: TasteDecoder
        PRODUCT_BUNDLE_IDENTIFIER: $(TD_BUNDLE_ID_PREFIX).TasteDecoder
        CODE_SIGN_ENTITLEMENTS: $(TD_APP_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Config/TasteDecoder-Info.plist
      properties:
        CFBundleDisplayName: Taste Decoder
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Taste Decoder uses the camera so you can save things that catch your eye.
        NSPhotoLibraryUsageDescription: Taste Decoder lets you pick photos to save and decode.
        NSPhotoLibraryAddUsageDescription: Taste Decoder can save your taste cards to Photos.
        ClaudeAPIKey: $(CLAUDE_API_KEY)
        ClaudeModel: $(CLAUDE_MODEL)
        AppGroupIdentifier: $(TD_APP_GROUP_ID)
        SupabaseProjectRef: $(SUPABASE_PROJECT_REF)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        CFBundleURLTypes:
          # Google Sign-In returns to the app through its reversed client id.
          - CFBundleURLName: google-sign-in
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
          # Pinterest connect finishes at tastedecoder://pinterest (via ASWebAuthenticationSession).
          - CFBundleURLName: taste-decoder
            CFBundleURLSchemes:
              - tastedecoder
    dependencies:
      - target: TasteDecoderShare
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn

  TasteDecoderShare:
    type: app-extension
    platform: iOS
    sources:
      - path: TasteDecoderShare
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: TasteDecoderShare
        PRODUCT_BUNDLE_IDENTIFIER: $(TD_BUNDLE_ID_PREFIX).TasteDecoder.Share
        CODE_SIGN_ENTITLEMENTS: $(TD_SHARE_ENTITLEMENTS)
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Config/TasteDecoderShare-Info.plist
      properties:
        CFBundleDisplayName: Taste Decoder
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(TD_APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true

  TasteDecoderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TasteCoreTests
    dependencies:
      - target: TasteDecoder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TD_BUNDLE_ID_PREFIX).TasteDecoderTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TasteDecoder:
    build:
      targets:
        TasteDecoder: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TasteDecoderTests
    archive:
      config: Release
